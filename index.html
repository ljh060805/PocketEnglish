 modal(`<h2>내 계정</h2><p>${esc(account.email||'로그인됨')}</p><p class="muted">${esc(statusText)}</p>${conflict?`<div class="notice">같은 데이터를 다른 기기에서 수정했습니다. 자동 덮어쓰기를 중지했습니다.<br>${esc(conflict.labels.slice(0,5).join(', '))}</div><div class="actions"><button class="ghost" id="keepLocal">이 기기 데이터 유지</button><button class="ghost" id="keepRemote">클라우드 데이터 사용</button><button class="ghost" id="conflictBackup">현재 데이터 백업</button></div>`:''}${hasGuest?'<div class="settingsrow"><b>로그인 전 데이터</b><p class="muted">이 브라우저의 기존 표현을 계정에 추가할 수 있습니다. 원본은 기기에 남습니다.</p><button class="ghost" id="importGuest">기존 표현 가져오기</button></div>':''}<div class="actions"><button class="primary" id="manualSync">동기화</button><button class="ghost" id="logout">로그아웃</button><button class="ghost" id="accountClose">닫기</button></div>`);
 $('accountClose').onclick=closeModal;$('manualSync').onclick=()=>{closeModal();syncNow(true)};$('logout').onclick=logout;
 $('conflictBackup')?.addEventListener('click',exportData);$('keepLocal')?.addEventListener('click',()=>resolveConflict(true));$('keepRemote')?.addEventListener('click',()=>resolveConflict(false));$('importGuest')?.addEventListener('click',()=>{if(syncBusy||conflict||cloud.rev===undefined){toast('먼저 클라우드 동기화를 완료하세요.');return;}if(!confirm('기존 표현을 계정에 추가할까요? 같은 ID의 표현은 계정 데이터를 유지합니다.'))return;const ids=new Set(state.items.map(x=>x.id));for(const x of guest.items)if(!ids.has(x.id)){state.items.push(clone(x));ids.add(x.id)}const h=new Set(state.history.map(stable));for(const x of guest.history)if(!h.has(stable(x))&&ids.has(x.id)){state.history.push(clone(x));h.add(stable(x))}writeLocal(accountKey()+'-guest-asked',true);persist();closeModal();refreshView();toast('기존 표현을 추가했습니다.');});
}
function resolveConflict(keepLocal){if(!conflict)return;if(!confirm(keepLocal?'클라우드의 충돌 데이터를 이 기기의 데이터로 교체할까요? 먼저 백업하는 것을 권장합니다.':'충돌한 변경은 클라우드 값을 사용하고 나머지 변경은 합칠까요? 먼저 백업하는 것을 권장합니다.'))return;const c=conflict;const m=mergeStates(cloud.base,state,c.remote);if(keepLocal){state=m.data;}else{state=mergeStates(cloud.base,c.remote,state).data;}cloud.base=clone(c.remote);cloud.rev=c.rev;cloud.dirty=!same(state,c.remote);conflict=null;storeCloud();closeModal();resetView();syncNow(true);}
async function authSubmit(signup){if(authBusy)return;const email=$('loginEmail').value.trim(),password=$('loginPass').value;const msg=$('authMessage');if(!email||password.length<6){msg.textContent='이메일과 6자 이상 비밀번호를 입력하세요.';return;}if(!client){msg.textContent='연결 라이브러리를 불러오지 못했습니다. 인터넷을 확인하세요.';return;}authBusy=true;msg.textContent='처리 중…';try{const res=signup?await client.auth.signUp({email,password,options:{emailRedirectTo:SITE_URL}}):await client.auth.signInWithPassword({email,password});if(res.error)throw res.error;if(res.data.session){await enterAccount(res.data.session.user);}else if(msg.isConnected){msg.textContent='인증 메일을 확인한 뒤 링크를 열어 로그인하세요.';}}catch(e){if(msg.isConnected)msg.textContent='실패: '+e.message;}finally{authBusy=false;}}
async function logout(){if(syncBusy){toast('동기화 중입니다. 완료 후 로그아웃하세요.');return;}if(cloud?.dirty&&!confirm('아직 클라우드에 저장되지 않은 변경이 있습니다. 이 기기에 남겨 두고 로그아웃할까요?'))return;try{const {error}=await client.auth.signOut({scope:'local'});if(error)throw error;leaveAccount();}catch(e){toast('로그아웃 실패: '+e.message);}}
async function initCloud(){drawAccount();$('accountBtn').onclick=openAccount;$('syncBtn').onclick=()=>conflict?openAccount():syncNow(true);if(!client){setStatus('연결 라이브러리 로딩 실패 · 기기 저장');return;}try{const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session)await enterAccount(data.session.user);else setStatus('기기 저장 · 로그인하면 동기화');}catch(e){setStatus('로그인 연결 확인 실패 · 기기 저장');}client.auth.onAuthStateChange((event,s)=>{setTimeout(()=>{if(s?.user){if(account?.id!==s.user.id)enterAccount(s.user);}else if(event==='SIGNED_OUT')leaveAccount();},0)});}
window.addEventListener('online',()=>syncNow());window.addEventListener('focus',()=>syncNow());document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});setInterval(()=>{if(!document.hidden)syncNow()},30000);
initCloud();
